<span class="in-out-container">
    @let imgReady = imageUploaded();
    <span class="in-out-item" [style.width.px]="inputPanelWidth"
        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.drag-over]="isDragOver()">
        <input #fileInput type="file" accept="image/*" (change)="onImageUpload($event)" style="display: none;" />
        @if (!imgReady) {
            <span class="upload-hint">
                <span class="upload-icon">&#8681;</span>
                <span>Drag & drop or click to upload</span>
            </span>
        }
        <canvas id="image-src-canvas"></canvas>
    </span>
    <span class="resize-handle-h" appResizeHandle="horizontal" (resized)="onInputPanelResized($event)"></span>
    <span class="in-out-item">
        @if (!imgReady) {
            <span>Result</span>
        }
        <!-- https://www.w3schools.com/howto/howto_js_image_magnifier_glass.asp -->
        <canvas id="image-dst-canvas" (mousemove)="moveMagnifier($event)" (mouseleave)="leaveMagnifier()"></canvas>
    </span>
    <div class="img-magnifier-glass" id="dst-magnifier"></div>
</span>
